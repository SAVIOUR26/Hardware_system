name: Build Windows Application

on:
  push:
    branches:
      - main
      - claude/**
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build renderer
        run: npm run build:renderer

      - name: Build electron
        run: npm run build:electron

      - name: Package for Windows
        run: npm run package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: List build outputs
        run: |
          dir dist
          dir dist\win-unpacked

      - name: Create portable ZIP
        run: |
          cd dist
          Compress-Archive -Path win-unpacked\* -DestinationPath hardware-manager-pro-${{ github.ref_name }}-windows-portable.zip
        shell: powershell

      - name: Upload Windows Portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: hardware-manager-pro-windows-portable
          path: dist/hardware-manager-pro-${{ github.ref_name }}-windows-portable.zip
          retention-days: 30

      - name: Upload Windows Executable
        uses: actions/upload-artifact@v4
        with:
          name: hardware-manager-pro-windows-exe
          path: dist/win-unpacked/hardware-manager-pro.exe
          retention-days: 30

      - name: Upload Windows Installer (if exists)
        uses: actions/upload-artifact@v4
        if: hashFiles('dist/*.exe') != ''
        with:
          name: hardware-manager-pro-windows-installer
          path: dist/*.exe
          retention-days: 30

      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/hardware-manager-pro-${{ github.ref_name }}-windows-portable.zip
            dist/*.exe
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
